<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product search</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 12vh 20px; background: #f5f7fb; color: #172033; font-family: system-ui, sans-serif; }
        main { width: min(680px, 100%); }
        h1 { margin-bottom: 8px; }
        p { color: #667085; }
        .search { position: relative; margin-top: 28px; }
        input { width: 100%; padding: 16px 18px; border: 1px solid #cfd5df; border-radius: 12px; background: white; font-size: 17px; outline: none; box-shadow: 0 8px 25px rgba(24, 39, 75, .08); }
        input:focus { border-color: #3767db; box-shadow: 0 0 0 3px rgba(55, 103, 219, .15); }
        #suggestions { position: absolute; z-index: 1; width: 100%; margin: 8px 0 0; padding: 6px; list-style: none; background: white; border: 1px solid #e2e6ee; border-radius: 12px; box-shadow: 0 14px 30px rgba(24, 39, 75, .14); }
        #suggestions:empty { display: none; }
        #suggestions a { display: flex; justify-content: space-between; gap: 20px; padding: 12px; color: inherit; text-decoration: none; border-radius: 8px; }
        #suggestions a:hover, #suggestions a:focus { background: #f0f4ff; }
        .meta { color: #667085; white-space: nowrap; }
        .message { padding: 12px; color: #667085; }
    </style>
</head>
<body>
<main>
    <h1>Find a product</h1>
    <p>Search by product name or category.</p>
    <div class="search">
        <input id="product-search" type="search" autocomplete="off" placeholder="Start typing…" aria-label="Search products" aria-controls="suggestions" aria-expanded="false">
        <ul id="suggestions" role="listbox"></ul>
    </div>
</main>
<script>
    const input = document.querySelector("#product-search");
    const list = document.querySelector("#suggestions");
    let timer;
    let controller;

    function showMessage(message) {
        list.replaceChildren();
        const item = document.createElement("li");
        item.className = "message";
        item.textContent = message;
        list.append(item);
        input.setAttribute("aria-expanded", "true");
    }

    function showResults(results) {
        list.replaceChildren();
        if (!results.length) {
            showMessage("No products found.");
            return;
        }
        for (const product of results) {
            const item = document.createElement("li");
            const link = document.createElement("a");
            const name = document.createElement("span");
            const meta = document.createElement("span");
            link.href = `/products/${encodeURIComponent(product.id)}/`;
            name.textContent = product.name;
            meta.className = "meta";
            meta.textContent = `${product.category} · ₹${Number(product.price).toFixed(2)}`;
            link.append(name, meta);
            item.append(link);
            list.append(item);
        }
        input.setAttribute("aria-expanded", "true");
    }

    input.addEventListener("input", () => {
        clearTimeout(timer);
        controller?.abort();
        const query = input.value.trim();
        if (query.length < 2) {
            list.replaceChildren();
            input.setAttribute("aria-expanded", "false");
            return;
        }
        timer = setTimeout(async () => {
            controller = new AbortController();
            try {
                const response = await fetch(`/products/suggestions/?q=${encodeURIComponent(query)}`, { signal: controller.signal });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                showResults(data.results);
            } catch (error) {
                if (error.name !== "AbortError") showMessage("Search is temporarily unavailable.");
            }
        }, 250);
    });

    document.addEventListener("click", event => {
        if (!event.target.closest(".search")) {
            list.replaceChildren();
            input.setAttribute("aria-expanded", "false");
        }
    });
</script>
</body>
</html>
