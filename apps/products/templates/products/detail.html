<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ product.product_name }}</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f5f7fb; color: #172033; font-family: system-ui, sans-serif; }
        article { width: min(560px, 100%); padding: 32px; background: white; border-radius: 16px; box-shadow: 0 14px 35px rgba(24, 39, 75, .12); }
        a { color: #3767db; text-decoration: none; }
        h1 { margin: 22px 0 8px; }
        .category { color: #667085; text-transform: capitalize; }
        dl { display: grid; grid-template-columns: auto 1fr; gap: 12px 24px; margin-top: 28px; }
        dt { color: #667085; }
        dd { margin: 0; font-weight: 600; }
    </style>
</head>
<body>
<article>
    <a href="{% url 'products:search' %}">← Back to search</a>
    <h1>{{ product.product_name }}</h1>
    <div class="category">{{ product.product_category }}</div>
    <dl>
        <dt>Price</dt><dd>${{ product.product_price }}</dd>
        <dt>Quantity</dt><dd>{{ product.product_quentity }}</dd>
    </dl>
</article>
</body>
</html>
